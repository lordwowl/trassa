<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Трасса</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101820; overflow: hidden; touch-action: none; }
      #game {
        position: fixed; inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #rotate { display: none; position: fixed; inset: 0; z-index: 30; background: #101820; color: #fff;
        font: 600 22px sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">↻ Поверните телефон горизонтально</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
